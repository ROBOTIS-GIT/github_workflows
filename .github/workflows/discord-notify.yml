name: Reusable Discord release notification

on:
  workflow_call:
    inputs:
      version:
        description: Existing published GitHub Release tag
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        description: Incoming webhook URL for the destination Discord channel
        required: true

permissions:
  contents: read

jobs:
  notify:
    name: Post release notes to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch release and post changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo '::error::DISCORD_WEBHOOK_URL is not configured for the calling repository.'
            exit 1
          fi

          gh release view "$VERSION" --json name,tagName,body,url,isDraft \
            | jq --arg repository "$GH_REPO" '
                if .isDraft then error("Cannot announce a draft release") else . end |
                {
                  allowed_mentions: {parse: []},
                  embeds: [{
                    title: (($repository + " — " + (.name // .tagName)) | .[:120]),
                    url: .url,
                    description: (
                      (.body // "") |
                      if length > 1900
                      then .[:1900] + "\n\n…See the release link for the full changelog."
                      elif length == 0 then "See the release link for details."
                      else . end
                    )
                  }]
                }
              ' > "$RUNNER_TEMP/discord-message.json"

          # Conservative text limits also accommodate emoji (two UTF-16 units).
          # wait=true confirms that Discord saved the message.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/discord-message.json" \
            "${DISCORD_WEBHOOK_URL}$([[ "$DISCORD_WEBHOOK_URL" == *\?* ]] && printf '&' || printf '?')wait=true" \
            > /dev/null
